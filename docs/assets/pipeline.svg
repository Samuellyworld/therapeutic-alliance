<text x="507" y="317" fill="#69c9ee" font-size="13" font-weight="700" letter-spacing="1.5">PREPROCESS</text>
<text x="462" y="358" fill="#f1f5fc" font-size="25" font-weight="700">spaCy</text>
<text x="462" y="390" fill="#aebed0" font-size="17">Tokenize &amp; split sentences</text>
<text x="462" y="415" fill="#aebed0" font-size="17">Count words &amp; language ratios</text>
<path d="M462 442H698" stroke="#8197b3" stroke-opacity=".18"/>
<text x="462" y="468" fill="#69c9ee" font-size="14">Negation + original text preserved</text>
