<text x="1247" y="347" text-anchor="middle" fill="#f4cd83" font-size="15" font-weight="700">04</text>
<text x="1277" y="347" fill="#f4cd83" font-size="13" font-weight="700" letter-spacing="1.5">EXPLORE</text>
<text x="1232" y="388" fill="#f1f5fc" font-size="25" font-weight="700">Reports &amp; provenance</text>
<text x="1232" y="420" fill="#aebed0" font-size="17">CSV tables + Matplotlib charts</text>
<text x="1232" y="445" fill="#aebed0" font-size="17">Portable HTML + run manifest</text>
<path d="M1232 477H1498" stroke="#8197b3" stroke-opacity=".18"/>
<text x="1232" y="503" fill="#f4cd83" font-size="14">Scores describe text, not outcomes</text>

<rect x="70" y="735" width="1450" height="112" rx="16" fill="#1b293d" stroke="#344b62"/>
<rect x="70" y="735" width="5" height="112" rx="2" fill="#62dec4"/>
<text x="100" y="773" fill="#e2ebf6" font-size="20" font-weight="650">Designed for learning. Grounded in limitations.</text>
<text x="100" y="805" fill="#a7b8cc" font-size="18">Fictional English text only · Local inference · Recorded model revisions · No clinical conclusions</text>
