<text x="137" y="317" fill="#63e6c2" font-size="13" font-weight="700" letter-spacing="1.5">INPUT</text>
<text x="92" y="358" fill="#f1f5fc" font-size="25" font-weight="700">Fictional notes</text>
<text x="92" y="390" fill="#aebed0" font-size="17">Two clients · ten sessions</text>
<text x="92" y="415" fill="#aebed0" font-size="17">Validated CSV rows</text>
