<text x="867" y="481" text-anchor="middle" fill="#c1a3fb" font-size="15" font-weight="700">03B</text>
<text x="897" y="481" fill="#c1a3fb" font-size="13" font-weight="700" letter-spacing="1.5">EMOTION</text>
<text x="852" y="522" fill="#f1f5fc" font-size="25" font-weight="700">DistilRoBERTa</text>
<text x="852" y="554" fill="#aebed0" font-size="17">All seven emotion scores</text>
<path d="M852 585H1098" stroke="#8197b3" stroke-opacity=".18"/>
<text x="852" y="611" fill="#c1a3fb" font-size="14">Chunk long text · weighted mean</text>
